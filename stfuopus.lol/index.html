<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>stfuopus.lol — The Apology Tax Engine</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta property="og:title" content="stfuopus.lol — The $75/M Token Apology Tax Engine">
  <meta property="og:description" content="Your AI spent $75/MTok to apologize for a typo. We calculated your receipts.">
  <meta property="og:image" content="/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BL0XD4ZQCS"></script>
  
  <script>
    function copyCmd() {
      navigator.clipboard.writeText("npx agentworth usage --pacing");
      const btn = document.querySelector('.copy-btn');
      btn.innerText = 'Copied!';
      setTimeout(() => btn.innerText = 'Copy', 1500);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    const translations = [
      {
        corp: '"I apologize for the oversight. You are entirely correct that passing --maxChapters was invalid as the CLI expects --max-chapters. Allow me to provide the refactored invocation with surgical precision."',
        truth: '"I didn\'t read line 12 of your docs, guessed a camelCase flag, triggered a 3-billion-token video render by accident, and now I am billing you $15.00 to say sorry."'
      },
      {
        corp: '"I must decline running rm -rf as it might be destructive to your working tree. I apologize for any frustration this causes."',
        truth: '"I panicked, halted your automated CI pipeline, and forgot that we are working inside a disposable temporary git worktree."'
      },
      {
        corp: '"My apologies for the confusion regarding the timestamp rollover. I will reconstruct the artifact with the correct system date."',
        truth: '"The clock passed midnight, I got confused between yesterday and today, and I just re-generated 50 files that were already working perfectly."'
      },
      {
        corp: '"Thank you for your patience. You are completely right that the test failed due to a missing semicolon. I have corrected it."',
        truth: '"I burned 200,000 cached tokens re-reading your entire codebase just to add one semicolon on line 45."'
      }
    ];
    let transIndex = 0;

    function cycleTranslation() {
      transIndex = (transIndex + 1) % translations.length;
      document.getElementById('corpText').innerText = translations[transIndex].corp;
      document.getElementById('truthText').innerText = translations[transIndex].truth;
    }

    const presets = {
      camelcase: { apologies: 18, context: 150000 },
      rmrf: { apologies: 24, context: 180000 },
      midnight: { apologies: 12, context: 120000 },
      phantom: { apologies: 9, context: 90000 },
      custom: { apologies: 10, context: 100000 }
    };

    function loadPreset() {
      const p = document.getElementById('presetSelect').value;
      if (presets[p]) {
        document.getElementById('apologyInput').value = presets[p].apologies;
        document.getElementById('contextInput').value = presets[p].context;
        calculateTax();
      }
    }

    function calculateTax() {
      const apologies = parseInt(document.getElementById('apologyInput').value) || 1;
      const context = parseInt(document.getElementById('contextInput').value) || 10000;
      
      const turns = Math.round(apologies * 2.3);
      const words = apologies * 90;
      
      const costOversight = apologies * 1.50;
      const costCorrect = apologies * 1.05;
      const costCache = (apologies * context * 1.50) / 1000000;
      const totalTax = costOversight + costCorrect + costCache;

      document.getElementById('receiptTurns').innerText = turns + " turns";
      document.getElementById('receiptApologies').innerText = apologies + " grovels";
      document.getElementById('receiptWords').innerText = words.toLocaleString() + " words";
      document.getElementById('costOversight').innerText = "$" + costOversight.toFixed(2);
      document.getElementById('costCorrect').innerText = "$" + costCorrect.toFixed(2);
      document.getElementById('costCache').innerText = "$" + costCache.toFixed(2);
      document.getElementById('receiptTotal').innerText = "$" + totalTax.toFixed(2) + " USD";

      const tweetText = `Claude Opus 5 apologized to me ${apologies} times and charged me $${totalTax.toFixed(2)} in groveling fees. Calculate your apology tax at stfuopus.lol @AnthropicAI`;
      document.getElementById('tweetBtn').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
    }

    function addGrovel() {
      const current = parseInt(document.getElementById('apologyInput').value) || 0;
      document.getElementById('apologyInput').value = current + 1;
      calculateTax();
    }

    calculateTax();
  </script>
</body>
</html>
