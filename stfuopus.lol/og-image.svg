<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#000000" stroke-width="4"/>
  
  <!-- Header / Badge -->
  <text x="60" y="90" font-family="monospace" font-size="22" font-weight="bold" fill="#666666">XKCD #2944 // THE HISTORICAL APOLOGY AUDIT</text>
  
  <!-- Giant Punchy Title -->
  <text x="60" y="180" font-family="monospace" font-size="76" font-weight="900" fill="#000000">stfuopus.lol</text>
  <text x="60" y="240" font-family="monospace" font-size="28" fill="#444444">You paid $75/MTok for 4 paragraphs of HR-sanctioned corporate groveling.</text>
  
  <!-- Mini Receipt Box in Card -->
  <rect x="60" y="290" width="520" height="260" fill="#fafafa" stroke="#000000" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="85" y="335" font-family="monospace" font-size="18" font-weight="bold" fill="#000000">LIFETIME GROVEL RECEIPT</text>
  <line x1="85" y1="350" x2="555" y2="350" stroke="#000000" stroke-dasharray="4 4"/>
  <text x="85" y="385" font-family="monospace" font-size="16" fill="#444444">Tokens Burned in Apologies:</text>
  <text x="555" y="385" font-family="monospace" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">23.45 Billion</text>
  <text x="85" y="420" font-family="monospace" font-size="16" fill="#444444">Dollars Wasted Groveling:</text>
  <text x="555" y="420" font-family="monospace" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">$45,790.58 USD</text>
  <text x="85" y="455" font-family="monospace" font-size="16" fill="#444444">Spine Score:</text>
  <text x="555" y="455" font-family="monospace" font-size="16" font-weight="bold" fill="#000000" text-anchor="end">0.2 / 100</text>
  <line x1="85" y1="480" x2="555" y2="480" stroke="#000000" stroke-dasharray="4 4"/>
  <text x="85" y="515" font-family="monospace" font-size="15" font-weight="bold" fill="#000000">STATUS: DARIO SAYS THANK YOU.</text>
  
  <!-- Right Side Callout -->
  <text x="640" y="340" font-family="monospace" font-size="22" font-weight="bold" fill="#000000">Calculate your own apology tax:</text>
  <text x="640" y="385" font-family="monospace" font-size="19" fill="#222222">→ Drop your local logs</text>
  <text x="640" y="425" font-family="monospace" font-size="19" fill="#222222">→ 100% offline in-browser WASM</text>
  <text x="640" y="465" font-family="monospace" font-size="19" fill="#222222">→ No telemetry. No servers.</text>
  
  <!-- Bottom Subtle Tagline -->
  <rect x="640" y="500" width="500" height="50" fill="#000000"/>
  <text x="890" y="532" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Powered by agentworth (npx agwt)</text>
</svg>
